[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-software-investigator"
version = "0.1.0"
description = "Autonomous forensic investigation engine and Agent Skill for software behavior."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "duanshengnan885", email = "duanshengnan885@users.noreply.github.com"}
]
keywords = [
    "investigation",
    "debugging",
    "forensics",
    "agent-skill",
    "claude-code",
    "antigravity",
    "cursor",
    "autonomous",
    "root-cause-analysis",
    "software-engineering"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/duanshengnan885/ai-software-investigator"
Repository = "https://github.com/duanshengnan885/ai-software-investigator.git"
"Bug Tracker" = "https://github.com/duanshengnan885/ai-software-investigator/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
investigator = "investigator.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
